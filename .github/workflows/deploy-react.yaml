name: Deploy React App

on:
  workflow_dispatch:

jobs:
  deploy-react:
    runs-on: ubuntu-latest
    needs: [build-react, second-job]

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: artifact
          run-id: 34645826752

      - name: Displat structure of downloaded files
        run: ls -R artifact
