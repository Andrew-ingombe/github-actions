name: Environment variables

on:
  push:
    branches: [main]

# env:
#   CHANNEL_NAME: InterviewPro

jobs:
  demo:
    runs-on: ubuntu-latest
    # env:
    #   CHANNEL_NAME: InterviewPro

    steps:
      - name: Greettings
        env:
          CHANNEL_NAME: InterviewPro
        run: echo "Hello, $CHANNEL_NAME!"

      - name: Get comments on ${{ env.CHANNEL_NAME }}
        run: |
          #HTTPS /api/comments
          echo "Awesome!!"
          echo "Great content!!"
          echo "Thank you for sharing!!"

  job2:
    runs-on: ubuntu-latest

    steps:
      - name: Greettings
        run: echo "Hello, ${{ env.CHANNEL_NAME }}! from job2"

      - name: Get comments on ${{ env.CHANNEL_NAME }}
        run: |
          #HTTPS /api/comments
          echo "Awesome!!"
          echo "Great content!!"
          echo "Thank you for sharing!!"

      - name: Set env variables programmatically
        run: echo "COUNT=10000" >> $GITHUB_ENV

      - name: Access env variables
        run: echo $COUNT
