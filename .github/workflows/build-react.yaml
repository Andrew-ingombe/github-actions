name: Build React App

on:
  push:
    branches: [main]

jobs:
  build-react:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependences
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: dist

  deploy-react:
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - name: Test
        run: echo 'test step'
