name: Step Output

on:
  push:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: set Output
        id: set-output
        shell: bash
        run: |
          echo "name=andrew" >> $GITHUB_OUTPUT
          echo "age=37" >> $GITHUB_OUTPUT

      - name: access output
        run: |
          echo "The value of output name is ${{steps.set-output.outputs.name}}"
          echo "The value of output age is ${{steps.set-output.outputs.age}}"
